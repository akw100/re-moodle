<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nicer Moodle</title>
<style>
  :root { color-scheme: light dark; font: 14px/1.4 system-ui, sans-serif; }
  body { margin: 0; width: 260px; padding: 14px; background: Canvas; color: CanvasText; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  .themes { display: grid; gap: 6px; margin-bottom: 12px; }
  label.theme { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid color-mix(in srgb, CanvasText 18%, transparent); border-radius: 8px; cursor: pointer; }
  label.theme:has(input:checked) { border-color: #6c63ff; box-shadow: 0 0 0 1px #6c63ff; }
  label.theme input { position: absolute; opacity: 0; }
  .sw { width: 20px; height: 20px; border-radius: 50%; border: 1px solid rgba(0,0,0,.25); flex: none; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; }
</style>
</head>
<body>
  <h1>🎨 Nicer Moodle</h1>
  <div class="themes" id="themes"></div>
  <label class="row">Animations &amp; confetti <input type="checkbox" id="motion"></label>
  <script src="popup.js"></script>
</body>
</html>
