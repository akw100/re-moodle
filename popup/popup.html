<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Re-Moodle</title>
<!-- The theme tiles are the same component as the in-page picker (base.css THEME PICKER section, NM.themeTiles in core.js). -->
<link rel="stylesheet" href="../src/base.css">
<!-- The voice select is shared with the in-page picker too (motd.css ".nm-voice" section). -->
<link rel="stylesheet" href="../src/features/motd.css">
<style>
  :root {
    color-scheme: light dark;
    --nm-bg: light-dark(#f6f6f8, #18181b);
    --nm-surface: light-dark(#ffffff, #1f1f23);
    --nm-surface-2: light-dark(#efeff3, #2a2a30);
    --nm-text: light-dark(#18181b, #ededf0);
    --nm-text-muted: light-dark(#5f5f6b, #a1a1ad);
    --nm-border: light-dark(#e2e2e8, #34343c);
    --nm-accent: light-dark(#4f46e5, #8b8cf8);
    --nm-accent-contrast: light-dark(#ffffff, #12122a);
    --nm-radius: 8px;
    --nm-font: system-ui, -apple-system, "Segoe UI", "Noto Sans Hebrew", sans-serif;
    --nm-heading-font: var(--nm-font);
    font: 13px/1.4 var(--nm-font);
    -webkit-font-smoothing: antialiased;
  }
  body { margin: 0; inline-size: 300px; background: var(--nm-bg); color: var(--nm-text); }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 14px 10px; }
  .mark {
    display: grid; place-items: center; flex: none; inline-size: 30px; block-size: 30px; border-radius: 8px;
     font-size: 17px;
  }
  h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -0.01em; line-height: 1.2; }
  .sub { margin: 1px 0 0; font-size: 12px; color: var(--nm-text-muted); }
  section { margin: 0 10px; padding: 10px 6px 6px; background: var(--nm-surface); border: 1px solid var(--nm-border); border-radius: 12px; }
  h2 { margin: 0; padding-inline: 6px; font-size: 13px; font-weight: 650; line-height: 1.3; color: var(--nm-text); }
  .nm-theme-group-label { margin-block-start: 8px; padding-inline: 6px; font-size: 11.5px; }
  .nm-theme-grid { gap: 2px; }
  .nm-theme-tile { padding: 5px 5px 6px; gap: 5px; }
  .nm-theme-prev-aa { font-size: 18px; }
  .nm-theme-name { font-size: 11.5px; line-height: 1.2; white-space: normal; text-wrap: balance; }
  .nm-theme-tile[aria-checked="true"]::after, .nm-theme-tile[aria-checked="true"]::before { inline-size: 16px; block-size: 16px; }
  .row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin: 10px 10px 12px; padding: 10px 12px;
    background: var(--nm-surface); border: 1px solid var(--nm-border); border-radius: 12px; cursor: pointer;
  }
  .row.voice { cursor: default; }
  .row b { display: block; font-size: 13px; font-weight: 600; }
  .row small { display: block; margin-top: 1px; font-size: 11.5px; color: var(--nm-text-muted); }
  .switch {
    appearance: none; flex: none; position: relative; margin: 0; inline-size: 34px; block-size: 20px; border-radius: 999px;
    background: color-mix(in srgb, var(--nm-text-muted) 45%, var(--nm-border)); cursor: pointer; transition: background-color .15s;
  }
  .switch::after {
    content: ""; position: absolute; inset-block-start: 2px; inset-inline-start: 2px; inline-size: 16px; block-size: 16px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / .3); transition: translate .15s;
  }
  .switch:checked { background: var(--nm-accent); }
  .switch:checked::after { translate: 14px 0; }
  .switch:focus-visible { outline: 2px solid var(--nm-accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .switch, .switch::after { transition: none; } }
</style>
</head>
<body>
  <header>
    <span class="mark" id="mark" aria-hidden="true"></span>
    <div>
      <h1>Re-Moodle</h1>
      <p class="sub">Your Moodle, remodeled</p>
    </div>
  </header>
  <section aria-labelledby="themes-label">
    <h2 id="themes-label">Theme</h2>
    <div class="nm-theme-grid" id="themes" role="radiogroup" aria-labelledby="themes-label"></div>
  </section>
  <div class="row voice">
    <label for="voice"><b>Header voice</b><small>Who talks to you on the dashboard</small></label>
    <span class="nm-voice-field"><select id="voice" class="nm-voice-select"></select></span>
  </div>
  <label class="row" for="motion">
    <span><b>Animations &amp; confetti</b><small>Turn off for a still, quiet Moodle</small></span>
    <input type="checkbox" class="switch" id="motion" role="switch">
  </label>
  <label class="row" for="previews">
    <span><b>Link previews</b><small id="previews-description">Reads a shortcut's page to fill in its name and preview. Needs access to sites you add.</small></span>
    <input type="checkbox" class="switch" id="previews" role="switch" aria-describedby="previews-description">
  </label>
  <label class="row" for="shnaton">
    <span><b>Class times from Shnaton</b><small id="shnaton-description">Reads your courses' meeting times from the public HUJI catalog</small></span>
    <input type="checkbox" class="switch" id="shnaton" role="switch" aria-describedby="shnaton-description">
  </label>
  <script src="../src/core.js"></script>
  <script src="../src/features/motd.js"></script>
  <script src="popup.js"></script>
</body>
</html>
